name: Publish

# Publishes the site, https://tahayvr.github.io/meet-omi/, from master, and
# only a build whose pack and player pass their checks. The site's own
# check runs in a browser, so it is run by hand: npm run check:site, or
# ?check on the live address.
#
# For this to be what publishes the site, the repo's Pages source has to be
# "GitHub Actions" (Settings, Pages), not a branch.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# one at a time, and never stop one halfway: a newer push waits its turn
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # pack/ is built from what's committed, and the player plays it right
      - run: npm run check
      # the site as it goes up: every file, stamped with this commit
      - run: node tools/publish-site.js _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
