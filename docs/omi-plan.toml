# Omi as a building block: anything that can read JSON and fill rectangles
# can show Omi, animate it and morph it, in any language or toolkit.
#
# This file is the plan and its progress. Update `status` as steps land
# (todo, doing, done) rather than editing the prose around it.

[architecture]
summary = """
The design jig is where Omi is designed. Everything an app needs comes out
of it as the Omi pack: data plus a written spec. Apps build on the pack, not
on the jig: they read omi.json and draw rectangles, either with the
reference player (JavaScript) or with their own player in their own
language, checked against the conformance data.
"""

# Each layer only depends on the ones above it.
[[layer]]
name = "Design jig"
path = "index.html, js/"
role = "Where modes and animations are designed. The source of truth."

[[layer]]
name = "Omi pack"
path = "pack/"
role = """
The published contract: omi.json (every mode, animation and morph setting),
README.md (the spec: units, pieces, roles, how to animate, how to morph),
conformance.json (what a correct player draws). Versioned by `version`.
"""
built_by = "node tools/build-pack.js, or Export Omi pack in the jig"

[[layer]]
name = "Players"
role = """
Turn the pack into rectangles on screen. A player has three jobs: work out
a mode's rects at time t, plan and play a morph, and fill rects. Drawing is
the host's; the rest is the same everywhere.
"""
reference = "player/omi.js: JavaScript, no dependencies, browser or headless"
others = """
Any language can have one by following pack/README.md: a Rust app with serde,
Swift with Codable, C++ or Python with any JSON library. A player passes when
tools/check-player.js's procedure passes for it against conformance.json.
"""

[[layer]]
name = "Shared state (optional)"
path = "protocol/, service/"
role = """
One Omi for the whole machine: a service holds what Omi is doing, any app or
script changes it, every app showing Omi follows in sync with its own player.
"""

[[layer]]
name = "Apps and environments"
role = """
Embed a player and call set(mode). Optionally share one Omi across apps
(see the shared state step).
"""

[principles]
items = [
  "The pack is the contract. Apps never depend on the jig's code.",
  "Everything a player draws is axis-aligned rects with an opacity.",
  "A mode at rest is frame 0 of its loops; a morph lands there and the loops start at t = 0.",
  "Every rule a player needs is in pack/README.md, and conformance.json proves it.",
  "Format changes that an existing player would misread bump the pack version.",
]

[[step]]
id = 1
title = "Animations as data"
status = "done"
detail = "Every loop is keyframes in js/motion.js; the page CSS and video export are generated from it."

[[step]]
id = 2
title = "Piece roles"
status = "done"
detail = "frame, eye, brow, mouth, tear, extra; morphs pair by role."

[[step]]
id = 3
title = "The Omi pack and its spec"
status = "done"
detail = "omi.json + README.md, exported from the jig."

[[step]]
id = 4
title = "Reference player"
status = "done"
detail = "player/omi.js; the jig's Morph section runs on it, fed the exported pack."

[[step]]
id = 5
title = "Conformance data and pack build"
status = "done"
detail = """
pack/conformance.json (every mode at 0, 0.9 and 3.3 s; 8 morphs),
tools/build-pack.js writes pack/ without a browser, tools/check-player.js
checks the reference player against it.
"""

[[step]]
id = 6
title = "Integration examples"
status = "done"
detail = """
examples/: a plain web page, a QML item running omi.js in QML's JavaScript
engine, and a terminal renderer (rects to half-block characters). The player
needs no browser: it runs in any JavaScript engine and hands hosts its rects.
The QML example runs in Qt 6 (checked headless with qml6) since step 9.
"""

[[step]]
id = 7
title = "Shared state across apps (optional)"
status = "done"
detail = """
protocol/README.md: one state (mode, from, since, instant) held by a
service, changed by any app over a Unix socket (JSON lines), followed by
every app with its own player. Changes carry `since`, and players run shared
changes on the wall clock, so every app shows the same frame. service/ has a
reference service, omictl and a Node client; tools/check-service.js checks
them end to end.
"""

[[step]]
id = 9
title = "Runs in the Omarchy shell"
status = "done"
detail = """
Qt 6's JavaScript (Quickshell, the Omarchy shell) couldn't load the player:
no object spread, Object.fromEntries or Array flat/flatMap. player/omi.js now
avoids them and draws the same frames. tools/conformance.js is the check,
in plain JavaScript; tools/check-player.js runs it in Node, again without
those built-ins, and fails on object spread; tools/check-quickshell.js runs
it inside Quickshell.
"""

[[step]]
id = 10
title = "Omarchy shell example and guide"
status = "done"
detail = """
examples/omarchy: an Omarchy shell plugin (omi.example) with a reusable
Omi.qml: the pack read with FileView, rects drawn as Rectangles snapped to
device pixels (crisp at fractional scales), the theme's accent, no work while
hidden, and react() for short reactions. install.sh installs it with the pack
copied in. docs/omarchy.md is the guide, including the modes to use for
common situations.
"""

[[step]]
id = 11
title = "Ideas from Omarchy apps"
status = "doing"
detail = """
docs/ideas.md collects new modes, reactions and format ideas as they come up
in real apps (first: the Omarchy onboarding), each with where it came from.
"""

[[step]]
id = 12
title = "Gaze"
status = "done"
detail = """
Where the eyes look, on top of any mode: pack.gaze (reach, duration, ease,
roles) and the player's look(dx, dy), gaze() and gazing; Omi.qml's `look`.
Conformance has gaze cases (halfway and landed). From onboarding: Omi looks
up at the bar from the workspaces card.
"""

[[step]]
id = 13
title = "Crisp on every host"
status = "done"
detail = """
"Drawing Omi crisp" in the pack README: snap edges to device pixels, a
whole number of pixels per logo cell (multiples of 22 across), the smallest
readable size, body motion at small sizes, one color. The player's canvas
draw and Omi.qml do it with `even` (default on); the terminal example sizes
to multiples of 22, uses the terminal's own background and the Omarchy
accent, leaves out whole-body motion (it stutters at that size; --bounce
brings it back), refits on resize and redraws only changed rows (20 KB instead of
4.8 MB over 4 s of idle). Drawing only: omi.json and conformance unchanged.
"""

[[step]]
id = 14
title = "Showcase examples"
status = "done"
detail = """
The web and Qt Quick examples present Omi at its best: centered with room
above, square corners like Omi, an entrance from the plain logo, eyes that
follow the pointer, a reaction on click or Space, arrows through the modes,
accent swatches, light and dark. examples/qml/Omi.qml is now the same item
as the Omarchy one (snapped Rectangles, even, look, react, rests when
hidden). tools/qml/tst_omi.qml checks it with qmltestrunner; the web page
was checked over the DevTools protocol (keys, pointer, click, swatches).
"""

[[step]]
id = 15
title = "What a mode is for"
status = "done"
detail = """
Each mode says whether it's a state or a reaction (`kind`), reactions carry
a `hold` (seconds to show after the morph lands), modes that mean the same
thing share a `family` (thinking, offline, transfer), and the jokes are
`easter`. The player has hold(mode) and kind(mode); Omi.qml's react() and
the web example time reactions from the pack, so every app reacts alike.
From onboarding: three hosts had three reaction lengths.
"""

[[step]]
id = 16
title = "Gaze stays inside the logo"
status = "done"
detail = """
gaze.inside: a box the gazing pieces never leave. The player limits each
look to the room the eyes have, so wide eyes (success, error) turn less far
by themselves and an app can always ask for a full look. Conformance has
success and error gaze cases. From onboarding: it had capped diagonals at
0.6 to keep success's eyes off the frame.
"""

[[step]]
id = 17
title = "A second player, in Rust"
status = "done"
detail = """
player/rust: an independent player written from pack/README.md and checked
against conformance.json (152 checks, and all 16 of the reference player's
in-between morph frames). It found the README short of a contract in 14
places: drawing order, the clip window's motion, delayed pieces at rest,
the clocks, which rects get cut, the rigid-group pairing, the assignment
cost, splits and fades, the stagger's 260-unit ripple, and more. The README
now states each exactly, and the reference player no longer applies the
gaze twice during a morph (its morph source is taken before the gaze).
"""

[[step]]
id = 8
title = "Publishing"
status = "todo"
detail = "Tag pack releases by version so apps can pin one; a changelog of format changes."
