[package]
name = "omi"
version = "0.1.0"
edition = "2021"
description = "Plays Omi, the Omarchy mascot, from an Omi pack: modes, loops, morphs and gaze, as a list of rects to fill"
license = "MIT"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "omi"
path = "src/lib.rs"
