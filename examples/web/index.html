<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Omi on a web page</title>
    <style>
      /* square corners throughout, like Omi */
      * {
        border-radius: 0;
      }
      :root {
        color-scheme: light dark;
        --bg: #f5f5f7;
        --fg: #1a1b26;
        --muted: #5a5f73;
        --line: #d5d7e0;
        /* Omi is one color: this is it */
        --accent: #2f7ae5;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #11121a;
          --fg: #e6e7ef;
          --muted: #9095a8;
          --line: #2c2f40;
          --accent: #33a1ff;
        }
      }
      body {
        margin: 0;
        padding: 0 16px 48px;
        background: var(--bg);
        color: var(--fg);
        font: 15px/1.5 ui-monospace, "JetBrains Mono", monospace;
      }
      main {
        max-width: 760px;
        margin: 0 auto;
        text-align: center;
      }
      header {
        position: absolute;
        top: 32px;
        left: 0;
        right: 0;
      }
      /* Omi in the middle of the first screen, with room above it; the modes
         are a scroll below */
      .stage {
        min-height: 100svh;
        display: grid;
        gap: 24px;
        place-content: center;
        justify-items: center;
      }
      h1 {
        margin: 0;
        font-size: 22px;
      }
      header p {
        margin: 4px 0 0;
        color: var(--muted);
      }
      /* the player draws in the canvas's CSS color */
      #omi {
        width: min(352px, 80vw);
        aspect-ratio: 1;
        color: var(--accent);
        cursor: pointer;
        touch-action: manipulation;
      }
      #name {
        margin: -12px 0 0;
        min-height: 1.5em;
        font-size: 18px;
      }
      .hint {
        margin: 0;
        color: var(--muted);
        font-size: 13px;
      }
      kbd {
        border: 1px solid var(--line);
        border-bottom-width: 2px;
        padding: 0 5px;
        font: inherit;
      }
      #accents {
        display: flex;
        gap: 10px;
      }
      #accents button {
        width: 28px;
        height: 28px;
        border: 2px solid var(--bg);
        outline: 1px solid var(--line);
        cursor: pointer;
      }
      #accents button[aria-pressed="true"] {
        outline: 2px solid var(--fg);
      }
      nav {
        padding-top: 8px;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 6px;
      }
      nav button {
        font: inherit;
        font-size: 13px;
        color: inherit;
        background: none;
        border: 1px solid var(--line);
        padding: 6px 10px;
        min-height: 36px;
        cursor: pointer;
      }
      nav button[aria-pressed="true"] {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--bg);
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Omi</h1>
        <p>The Omarchy logo, brought to life.</p>
      </header>

      <section class="stage">
        <canvas id="omi" role="img" aria-label="Omi"></canvas>
        <p id="name" aria-live="polite"></p>
        <p class="hint">
          Omi watches your pointer. Click it or press <kbd>Space</kbd> to make
          it happy; <kbd>←</kbd> <kbd>→</kbd> step through the modes.
        </p>
        <div id="accents" role="group" aria-label="Omi's color"></div>
      </section>

      <nav id="modes" aria-label="Modes"></nav>
    </main>

    <!-- the player and the pack, straight from the published pack folder -->
    <script src="../../pack/omi.js"></script>
    <script type="module">
      const pack = await (await fetch("../../pack/omi.json")).json();
      const canvas = document.getElementById("omi");
      // With reduced motion: no loops, no gaze, and modes jump instead of morphing.
      const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
      const omi = new Omi(canvas, pack, { animate: !still, mode: "mark" });
      window.omi = omi; // to play with from the browser's console

      // --- what Omi is doing: `mode`, with a reaction playing over it for a moment
      let mode = "idle",
        reacting = null;
      const setMode = (id) => {
        mode = id;
        if (!reacting) omi.set(id, { instant: still });
        show();
      };
      // A reaction: a mode for a moment (its loop, between 1.2 and 2.5 s), then back.
      const react = (id) => {
        clearTimeout(reacting);
        omi.set(id, { instant: still });
        reacting = setTimeout(() => {
          reacting = null;
          omi.set(mode, { instant: still });
        }, (Math.min(2.5, Math.max(1.2, omi.loopSeconds(id))) + pack.morph.duration) * 1000);
      };

      // --- the eyes follow the pointer, and look ahead again when it rests
      let rest = 0;
      addEventListener("pointermove", (e) => {
        if (still) return;
        const r = canvas.getBoundingClientRect(),
          dx = e.clientX - (r.left + r.width / 2),
          dy = e.clientY - (r.top + r.height / 2),
          reach = r.width * 1.5; // full tilt this far from Omi's center
        omi.look(Math.max(-1, Math.min(1, dx / reach)), Math.max(-1, Math.min(1, dy / reach)));
        clearTimeout(rest);
        rest = setTimeout(() => omi.look(0, 0), 2500);
      });
      document.addEventListener("pointerleave", () => omi.look(0, 0));

      // --- poke Omi
      canvas.addEventListener("click", () => react("happy"));
      addEventListener("keydown", (e) => {
        if (e.target.closest("button")) return; // let buttons take their keys
        const ids = pack.modes.map((m) => m.id),
          i = ids.indexOf(mode);
        if (e.key === " ") react("happy");
        else if (e.key === "ArrowRight") setMode(ids[(i + 1) % ids.length]);
        else if (e.key === "ArrowLeft") setMode(ids[(i - 1 + ids.length) % ids.length]);
        else return;
        e.preventDefault();
      });

      // --- one color, any color
      const accents = document.getElementById("accents"),
        swatches = ["", "#9ece6a", "#f7768e", "#e0af68", "#bb9af7"]; // "": the page's accent
      accents.innerHTML = swatches
        .map((c) => `<button style="background:${c || "var(--accent)"}" data-color="${c}" aria-label="${c || "Page accent"}"></button>`)
        .join("");
      accents.addEventListener("click", (e) => {
        const b = e.target.closest("button");
        if (!b) return;
        canvas.style.color = b.dataset.color; // "" falls back to --accent
        omi.draw();
        showAccent();
      });
      const showAccent = () =>
        accents.querySelectorAll("button").forEach((b) =>
          b.setAttribute("aria-pressed", String(b.dataset.color === canvas.style.color || (!b.dataset.color && !canvas.style.color))),
        );

      // --- every mode, one button each
      const nav = document.getElementById("modes"),
        name = document.getElementById("name");
      nav.innerHTML = pack.modes.map((m) => `<button data-mode="${m.id}">${m.name}</button>`).join("");
      nav.addEventListener("click", (e) => {
        const b = e.target.closest("button");
        if (b) setMode(b.dataset.mode);
      });
      function show() {
        name.textContent = pack.modes.find((m) => m.id === mode).name;
        nav.querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.mode === mode)));
      }

      showAccent();
      show();
      // Omi starts as the plain logo and comes to life.
      setTimeout(() => omi.set(mode, { instant: still }), 600);
    </script>
  </body>
</html>
